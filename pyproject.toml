[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev"
version = "0.1.0"
description = "Client for Jev-style decision models, starting with Cloudflare Clef on Workers AI."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/jev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
